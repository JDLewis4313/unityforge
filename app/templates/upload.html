{% extends "base.html" %}
{% block content %}
<h2>Upload Audio or Pull from YouTube</h2>

<form id="upload-form" enctype="multipart/form-data">
  <label for="audio">Upload audio file:</label>
  <input type="file" name="audio" id="audio" accept="audio/*" required>
  <button type="submit">Analyze</button>
</form>

<form id="youtube-form">
  <label for="youtube_url">YouTube URL:</label>
  <input type="text" name="youtube_url" id="youtube_url" required>
  <button type="submit">Fetch & Analyze</button>
</form>

<div id="results"></div>

<script>
document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData();
  formData.append('audio', document.getElementById('audio').files[0]);

  const res = await fetch("{{ url_for('soundlab.analyze_audio') }}", {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  renderResult(data);
});

document.getElementById('youtube-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch("{{ url_for('soundlab.fetch_youtube_audio') }}", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ youtube_url: document.getElementById('youtube_url').value })
  });
  const data = await res.json();
  renderResult(data);
});

function renderResult(data) {
  document.getElementById('results').innerHTML = data.entry
    ? `<p><strong>File:</strong> ${data.entry.filename}</p>
       <p><strong>Duration:</strong> ${data.entry.duration}s</p>
       <p><strong>Peak dB:</strong> ${data.entry.peak} dB</p>
       <p><strong>Tempo:</strong> ${data.entry.tempo} BPM</p>
       <img src="/static/spectrograms/${data.entry.spectrogram}" alt="Spectrogram" class="img-fluid mt-2">`
    : `<div class="alert alert-danger">${data.error}</div>`;
}
</script>
{% endblock %}
