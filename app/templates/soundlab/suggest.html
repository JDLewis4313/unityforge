{% extends "base.html" %}
{% import 'bootstrap_wtf.html' as wtf %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0"><i class="bi bi-lightbulb"></i> Suggest Content</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Share music, playlist suggestions, or audio content with the community.
                </p>
                {{ wtf.quick_form(form) }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
